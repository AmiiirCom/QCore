name: QCore Automated Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.arch_name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    strategy:
      fail-fast: false
      matrix:
        include:
          # ۱. لینوکس استاتیک x86_64 (سازگار با همه لینوکس‌ها + تولید خودکار پکیج‌های deb و arch)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch_name: linux-x86_64-musl
            use_cross: true
            is_windows: false
            package_deb_arch: true
            deb_arch: amd64
            pacman_arch: x86_64

          # ۲. لینوکس استاتیک ARM64 (تولید خودکار پکیج deb برای ARM64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            arch_name: linux-aarch64-musl
            use_cross: true
            is_windows: false
            package_deb_arch: true
            deb_arch: arm64
            pacman_arch: aarch64

          # ۳. لینوکس استاندارد gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch_name: linux-x86_64-gnu
            use_cross: false
            is_windows: false
            package_deb_arch: false

          # ۴. ویندوز ۶۴ بیتی استاندارد (AMD و Intel)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch_name: windows-x86_64
            use_cross: false
            is_windows: true

          # ۵. ویندوز پردازنده‌های ARM (Snapdragon / Surface)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch_name: windows-arm64
            use_cross: false
            is_windows: true

          # ۶. مکینتاش پردازنده‌های اپل (M1 تا M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_name: macos-arm64
            use_cross: false
            is_windows: false

          # ۷. مکینتاش پردازنده‌های اینتل
          - os: macos-latest
            target: x86_64-apple-darwin
            arch_name: macos-x86_64
            use_cross: false
            is_windows: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross for Linux
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Project (Standard)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Build Project (Cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }}

      # بسته‌بندی فایل‌های ویندوز (.zip)
      - name: Package Windows Binary
        if: matrix.is_windows
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $distName = "qcore-${tag}-${{ matrix.arch_name }}"
          New-Item -ItemType Directory -Force -Path $distName
          Copy-Item "target/${{ matrix.target }}/release/qcore-server.exe" "$distName/"
          Copy-Item "target/${{ matrix.target }}/release/qcore-client.exe" "$distName/"
          Compress-Archive -Path "$distName/*" -DestinationPath "${distName}.zip"
          Get-FileHash -Algorithm SHA256 "${distName}.zip" | ForEach-Object { "$($_.Hash)  ${distName}.zip" } | Out-File -Encoding ascii "${distName}.zip.sha256"
          New-Item -ItemType Directory -Force -Path artifacts
          Move-Item "${distName}.zip" artifacts/
          Move-Item "${distName}.zip.sha256" artifacts/

      # بسته‌بندی فایل‌های فشرده لینوکس و مک (.tar.gz)
      - name: Package Unix Archive
        if: "!matrix.is_windows"
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          DIST_NAME="qcore-${TAG}-${{ matrix.arch_name }}"
          mkdir -p "${DIST_NAME}"
          cp "target/${{ matrix.target }}/release/qcore-server" "${DIST_NAME}/"
          cp "target/${{ matrix.target }}/release/qcore-client" "${DIST_NAME}/"
          tar -czvf "${DIST_NAME}.tar.gz" "${DIST_NAME}"
          shasum -a 256 "${DIST_NAME}.tar.gz" > "${DIST_NAME}.tar.gz.sha256"
          mkdir -p artifacts
          mv "${DIST_NAME}.tar.gz" artifacts/
          mv "${DIST_NAME}.tar.gz.sha256" artifacts/

      # ساخت پکیج‌های رسمی دبیان (.deb) و آرچ لینوکس (.pkg.tar.zst)
      - name: Build Debian (.deb) and Arch Linux (.pkg.tar.zst) Packages
        if: matrix.package_deb_arch
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VER="${TAG#v}"

          # --- ۱. پکیج رسمی دبیان/اوبونتو (.deb) ---
          DEB_DIR="deb_package"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/local/bin"
          mkdir -p "${DEB_DIR}/etc/systemd/system"
          mkdir -p "${DEB_DIR}/etc/qcore"

          cp "target/${{ matrix.target }}/release/qcore-server" "${DEB_DIR}/usr/local/bin/"
          cp "target/${{ matrix.target }}/release/qcore-client" "${DEB_DIR}/usr/local/bin/"
          chmod 755 "${DEB_DIR}/usr/local/bin/qcore-server" "${DEB_DIR}/usr/local/bin/qcore-client"

          cat <<EOF > "${DEB_DIR}/DEBIAN/control"
          Package: qcore
          Version: ${CLEAN_VER}
          Section: net
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: QCore Team
          Description: QCore Quantum-Resistant High-Stealth Anti-Censorship Proxy Core
          EOF

          cat <<EOF > "${DEB_DIR}/DEBIAN/postinst"
          #!/bin/sh
          systemctl daemon-reload
          echo "QCore installed successfully! Run 'qcore-server setup' to initialize."
          EOF
          chmod 755 "${DEB_DIR}/DEBIAN/postinst"

          dpkg-deb --build "${DEB_DIR}" "artifacts/qcore-${TAG}-linux-${{ matrix.deb_arch }}.deb"
          shasum -a 256 "artifacts/qcore-${TAG}-linux-${{ matrix.deb_arch }}.deb" > "artifacts/qcore-${TAG}-linux-${{ matrix.deb_arch }}.deb.sha256"

          # --- ۲. پکیج رسمی آرچ لینوکس (.pkg.tar.zst) ---
          ARCH_DIR="arch_package"
          mkdir -p "${ARCH_DIR}/usr/local/bin"
          cp "target/${{ matrix.target }}/release/qcore-server" "${ARCH_DIR}/usr/local/bin/"
          cp "target/${{ matrix.target }}/release/qcore-client" "${ARCH_DIR}/usr/local/bin/"

          cat <<EOF > "${ARCH_DIR}/.PKGINFO"
          pkgname = qcore
          pkgver = ${CLEAN_VER}-1
          pkgdesc = QCore Quantum-Resistant High-Stealth Anti-Censorship Proxy Core
          url = https://github.com/${{ github.repository }}
          builddate = $(date +%s)
          packager = QCore Team
          size = $(du -sb "${ARCH_DIR}/usr" | awk '{print $1}')
          arch = ${{ matrix.pacman_arch }}
          license = MIT
          EOF

          cd "${ARCH_DIR}"
          tar -cf - .PKGINFO usr | zstd -c -T0 > "../artifacts/qcore-${TAG}-arch-${{ matrix.pacman_arch }}.pkg.tar.zst"
          cd ..
          shasum -a 256 "artifacts/qcore-${TAG}-arch-${{ matrix.pacman_arch }}.pkg.tar.zst" > "artifacts/qcore-${TAG}-arch-${{ matrix.pacman_arch }}.pkg.tar.zst.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch_name }}
          path: src/artifacts/*
          if-no-files-found: error

  # مرحله انتشار در Releases
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Generate Dynamic Changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            export RANGE="${PREV_TAG}..${{ github.ref_name }}"
            HEADER="## 📋 تغییرات نگارش ${{ github.ref_name }} (نسبت به $PREV_TAG):"
          else
            export RANGE="${{ github.ref_name }}"
            HEADER="## 📋 تمامی تغییرات در نگارش ${{ github.ref_name }}:"
          fi

          echo "$HEADER" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          python3 << 'EOF'
          import os
          import subprocess

          range_arg = os.environ.get("RANGE", "HEAD")
          cmd = ['git', 'log', range_arg, '--pretty=format:__COMMIT__%h|%s|%b']
          res = subprocess.check_output(cmd).decode('utf-8', errors='ignore')

          commits = res.split('__COMMIT__')
          lines = []
          for c in commits:
              if not c.strip():
                  continue
              parts = c.split('|', 2)
              h = parts[0]
              s = parts[1].strip()
              b = parts[2].strip() if len(parts) > 2 else ''
              
              entry = f'* **{s}** (`{h}`)'
              if b:
                  indented_b = '\n'.join('  > ' + line for line in b.splitlines() if line.strip())
                  entry += f'\n{indented_b}'
              lines.append(entry)

          with open('RELEASE_NOTES.md', 'a', encoding='utf-8') as f:
              f.write('\n\n'.join(lines) + '\n')
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QCore ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}